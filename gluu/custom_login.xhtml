<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html">

<f:metadata>
	<f:viewAction action="#{authenticator.prepareAuthenticationForStep}" if="#{not identity.loggedIn}" />
</f:metadata>

<f:view>
	<h:head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>#{msgs['casa.login.title']}</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<style type="text/css">
			.providers-section {
				display: none;
			}

			.providers-section.is-visible {
				display: block;
			}

			.provider-list {
				width: 100%;
				border-collapse: separate;
				border-spacing: 0 8px;
			}

			.provider-row {
				cursor: pointer;
			}

			.provider-cell {
				padding: 12px 16px;
				border: 1px solid #e2e8f0;
				border-radius: 12px;
				color: #334155;
				font-size: 14px;
				font-weight: 600;
				text-align: center;
				transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease;
			}

			.provider-row:hover .provider-cell {
				border-color: #c4b5fd;
				background: #f5f3ff;
				color: #5b21b6;
			}

			@media (prefers-reduced-motion: reduce) {
				.provider-cell {
					transition: none;
				}
			}
		</style>
	</h:head>

	<h:body class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-slate-950 px-4 py-10 font-sans text-slate-900 antialiased sm:px-6">
		<div aria-hidden="true" class="pointer-events-none absolute -left-32 -top-32 h-96 w-96 rounded-full bg-indigo-500/20 blur-3xl"></div>
		<div aria-hidden="true" class="pointer-events-none absolute -bottom-40 -right-24 h-[28rem] w-[28rem] rounded-full bg-fuchsia-500/15 blur-3xl"></div>

		<main class="relative w-full max-w-[470px] overflow-hidden rounded-[2rem] border border-white/60 bg-white/[0.97] p-7 shadow-[0_35px_100px_rgba(0,0,0,0.45)] backdrop-blur-xl sm:p-10">
			<div aria-hidden="true" class="absolute inset-x-10 top-0 h-1 rounded-b-full bg-gradient-to-r from-indigo-500 via-violet-500 to-amber-300"></div>
			<div aria-hidden="true" class="mb-7 flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-500 shadow-lg shadow-violet-500/25">
				<span class="h-3 w-3 rotate-45 rounded-sm border-2 border-white/90"></span>
			</div>

			<noscript>
				<p class="mb-5 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm leading-6 text-rose-800">#{msgs['passport.javascriptRequired']}</p>
			</noscript>

			<h2 class="mb-8 text-2xl font-bold tracking-tight text-slate-900 sm:text-[1.75rem]">#{msgs['casa.login.panel_title']}</h2>
			<h:messages class="mb-5 space-y-2 text-sm leading-6 text-rose-700 [&amp;>li]:rounded-xl [&amp;>li]:border [&amp;>li]:border-rose-200 [&amp;>li]:bg-rose-50 [&amp;>li]:px-4 [&amp;>li]:py-3" />

			<h:form id="loginForm" class="space-y-5">
				<div>
					<h:outputLabel for="username" value="#{msgs['login.username']}" class="mb-2 block text-sm font-semibold text-slate-700" />
					<h:inputText id="username" value="#{credentials.username}" required="true"
						class="block min-h-12 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 text-[15px] text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-violet-500 focus:bg-white focus:ring-4 focus:ring-violet-100 motion-reduce:transition-none" />
				</div>

				<div>
					<h:outputLabel for="password" value="#{msgs['login.password']}" class="mb-2 block text-sm font-semibold text-slate-700" />
					<h:inputSecret id="password" value="#{credentials.password}" required="true"
						class="block min-h-12 w-full rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 text-[15px] text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-violet-500 focus:bg-white focus:ring-4 focus:ring-violet-100 motion-reduce:transition-none" />
				</div>

				<div class="-mt-1 text-right text-sm">
					<a class="rounded font-semibold text-violet-700 underline-offset-4 transition hover:text-violet-900 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-violet-500 motion-reduce:transition-none" href="/identity/person/passwordReminder.htm">#{msgs['login.forgotYourPassword']}</a>
				</div>

				<div class="pt-1">
					<h:commandButton class="min-h-12 w-full cursor-pointer rounded-xl bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 px-5 py-3 text-[15px] font-semibold text-white shadow-lg shadow-violet-600/25 transition duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-violet-600/30 active:translate-y-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-violet-500 motion-reduce:transform-none motion-reduce:transition-none"
						value="#{msgs['login.login']}"
						action="#{authenticator.authenticate}"
						id="loginButton" />
				</div>

				<div id="providersSection" class="providers-section mt-7 border-t border-slate-200 pt-6">
					<p id="alternative" class="mb-3 text-center text-xs font-semibold uppercase tracking-[0.16em] text-slate-400">#{msgs['passport.orUseExternal']}</p>
					<table class="provider-list">
						<tbody id="add_here">
						</tbody>
					</table>
				</div>

				<h:inputHidden id="platform" />
				<h:inputHidden id="provider" />
			</h:form>
		</main>

		<script type="text/javascript">
			//<![CDATA[
			(function () {
				var jsonProviders = '${identity.getWorkingParameter("externalProviders")}';

				function setInputsRequired(isRequired) {
					var userEl = document.getElementById("loginForm:username");
					var pwdEl = document.getElementById("loginForm:password");
					if (userEl) {
						if (isRequired) {
							userEl.setAttribute("required", "required");
						} else {
							userEl.removeAttribute("required");
						}
					}
					if (pwdEl) {
						if (isRequired) {
							pwdEl.setAttribute("required", "required");
						} else {
							pwdEl.removeAttribute("required");
						}
					}
				}

				function fillPlatformField() {
					var platformField = document.getElementById("loginForm:platform");
					if (!platformField) {
						return;
					}
					try {
						var info = {
							userAgent: navigator.userAgent,
							language: navigator.language || "",
							platform: navigator.platform || ""
						};
						platformField.value = JSON.stringify(info);
					} catch (e) {
					}
				}

				window.idp_redirect = function (provider) {
					setInputsRequired(false);
					var form = document.forms["loginForm"];
					var providerField = document.getElementById("loginForm:provider");
					var loginButton = document.getElementById("loginForm:loginButton");

					if (providerField) {
						providerField.value = provider;
					}
					if (loginButton) {
						loginButton.click();
					} else if (form) {
						form.submit();
					}
				};

				function addRow(provider, name) {
					var tbody = document.getElementById("add_here");
					if (!tbody) {
						return;
					}
					var displayName = name ? name : provider;

					var tr = document.createElement("tr");
					tr.className = "provider-row";
					tr.addEventListener("click", function () {
						window.idp_redirect(provider);
					});

					var td = document.createElement("td");
					td.className = "provider-cell";
					td.textContent = displayName;

					tr.appendChild(td);
					tbody.appendChild(tr);
				}

				function renderExternalProviders() {
					try {
						if (!jsonProviders) {
							return;
						}
						var externalProviders = JSON.parse(jsonProviders);
						var ids = Object.keys(externalProviders);

						if (ids.length > 0) {
							ids.sort(function (p1, p2) {
								var n1 = externalProviders[p1] && externalProviders[p1].displayName ? externalProviders[p1].displayName : p1;
								var n2 = externalProviders[p2] && externalProviders[p2].displayName ? externalProviders[p2].displayName : p2;
								return n1 > n2 ? 1 : (n1 < n2 ? -1 : 0);
							});

							for (var i = 0; i < ids.length; i++) {
								var provider = ids[i];
								var prov = externalProviders[provider] || {};
								var name = prov.displayName ? prov.displayName : provider;
								addRow(provider, name);
							}

							var section = document.getElementById("providersSection");
							if (section) {
								section.className += " is-visible";
							}
						}
					} catch (e) {
					}
				}

				document.addEventListener("DOMContentLoaded", function () {
					setInputsRequired(true);
					fillPlatformField();
					renderExternalProviders();
				});
			})();
			//]]>
		</script>
	</h:body>
</f:view>
</html>
