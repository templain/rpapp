<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html">

<f:metadata>
	<f:viewAction action="#{authenticator.prepareAuthenticationForStep}" if="#{not identity.loggedIn}" />
</f:metadata>

<f:view>
	<h:head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>#{msgs['casa.login.title']}</title>
		<style type="text/css">
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 32px 20px;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background:
					radial-gradient(ellipse at 12% 12%, rgba(119, 160, 255, 0.22), transparent 34%),
					radial-gradient(ellipse at 88% 88%, rgba(101, 214, 200, 0.18), transparent 32%),
					#f3f6fc;
				color: #18243a;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
			}

			.login-card {
				position: relative;
				width: 100%;
				max-width: 420px;
				padding: 40px;
				background: rgba(255, 255, 255, 0.96);
				border: 1px solid rgba(218, 226, 239, 0.9);
				border-radius: 22px;
				box-shadow: 0 24px 70px rgba(34, 55, 92, 0.14), 0 4px 12px rgba(34, 55, 92, 0.05);
			}

			.login-card::before {
				position: absolute;
				top: 0;
				left: 40px;
				right: 40px;
				height: 3px;
				border-radius: 0 0 3px 3px;
				background: linear-gradient(90deg, #4568e8, #45b7ad);
				content: "";
			}

			.login-title {
				margin: 0 0 28px;
				font-size: 25px;
				font-weight: 700;
				letter-spacing: -0.035em;
				line-height: 1.3;
				color: #192944;
			}

			.noscript-msg {
				margin: 0 0 18px;
				padding: 12px 14px;
				border: 1px solid #fecaca;
				border-radius: 10px;
				background: #fff1f2;
				color: #a32135;
				font-size: 13px;
				line-height: 1.5;
			}

			.messages {
				list-style: none;
				padding: 0;
				margin: 0 0 20px;
				color: #a32135;
				font-size: 13px;
				line-height: 1.5;
			}

			.messages li {
				padding: 11px 13px;
				border: 1px solid #fecaca;
				border-radius: 10px;
				background: #fff1f2;
			}

			.field {
				margin-bottom: 20px;
			}

			.field label {
				display: block;
				margin-bottom: 8px;
				color: #34445f;
				font-size: 13px;
				font-weight: 600;
			}

			.field input[type="text"],
			.field input[type="password"] {
				width: 100%;
				min-height: 48px;
				padding: 12px 14px;
				border: 1px solid #d5deeb;
				border-radius: 11px;
				background: #fbfcfe;
				color: #18243a;
				font: inherit;
				font-size: 15px;
				transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
			}

			.field input[type="text"]:focus,
			.field input[type="password"]:focus {
				outline: none;
				border-color: #5576e8;
				background: #fff;
				box-shadow: 0 0 0 4px rgba(85, 118, 232, 0.14);
			}

			.forgot-wrap {
				margin: -3px 0 22px;
				font-size: 13px;
			}

			.forgot-wrap a {
				color: #4666d7;
				font-weight: 600;
				text-decoration: none;
			}

			.forgot-wrap a:hover {
				text-decoration: underline;
			}

			.forgot-wrap a:focus-visible,
			.submit-btn:focus-visible {
				outline: 3px solid rgba(85, 118, 232, 0.45);
				outline-offset: 3px;
			}

			.submit-btn {
				width: 100%;
				min-height: 50px;
				padding: 12px 18px;
				border: 0;
				border-radius: 11px;
				background: linear-gradient(110deg, #4568e8, #3657cf);
				box-shadow: 0 8px 18px rgba(63, 91, 207, 0.22);
				color: #fff;
				cursor: pointer;
				font: inherit;
				font-size: 15px;
				font-weight: 600;
				transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
			}

			.submit-btn:hover {
				transform: translateY(-1px);
				box-shadow: 0 11px 22px rgba(63, 91, 207, 0.28);
				filter: brightness(1.04);
			}

			.submit-btn:active {
				transform: translateY(0);
			}

			.providers-section {
				display: none;
				margin-top: 26px;
				padding-top: 22px;
				border-top: 1px solid #e8edf5;
			}

			.providers-section.is-visible {
				display: block;
			}

			.alternative-label {
				margin: 0 0 14px;
				color: #74819a;
				font-size: 12px;
				font-weight: 600;
				text-align: center;
			}

			.provider-list {
				width: 100%;
				border-collapse: separate;
				border-spacing: 0 8px;
			}

			.provider-row {
				cursor: pointer;
			}

			.provider-row:hover {
				background: #f4f7ff;
			}

			.provider-cell {
				padding: 12px 14px;
				border: 1px solid #e1e7f1;
				border-radius: 10px;
				color: #34445f;
				font-size: 13px;
				font-weight: 600;
				text-align: center;
				transition: border-color 160ms ease, background-color 160ms ease;
			}

			.provider-row:hover .provider-cell {
				border-color: #bdcafa;
				background: #f4f7ff;
			}

			@media (max-width: 480px) {
				body {
					padding: 20px 14px;
				}

				.login-card {
					padding: 32px 24px;
					border-radius: 18px;
				}

				.login-card::before {
					left: 24px;
					right: 24px;
				}

				.login-title {
					font-size: 23px;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.field input[type="text"],
				.field input[type="password"],
				.submit-btn,
				.provider-cell {
					transition: none;
				}
			}
		</style>
	</h:head>

	<h:body>
		<main class="login-card">
			<noscript>
				<p class="noscript-msg">#{msgs['passport.javascriptRequired']}</p>
			</noscript>

			<h2 class="login-title">#{msgs['casa.login.panel_title']}</h2>
			<h:messages class="messages" />

			<h:form id="loginForm">
				<div class="field">
					<h:outputLabel for="username" value="#{msgs['login.username']}" />
					<h:inputText id="username" value="#{credentials.username}" required="true" />
				</div>

				<div class="field">
					<h:outputLabel for="password" value="#{msgs['login.password']}" />
					<h:inputSecret id="password" value="#{credentials.password}" required="true" />
				</div>

				<div class="forgot-wrap">
					<a href="/identity/person/passwordReminder.htm">#{msgs['login.forgotYourPassword']}</a>
				</div>

				<div>
					<h:commandButton class="submit-btn"
						value="#{msgs['login.login']}"
						action="#{authenticator.authenticate}"
						id="loginButton" />
				</div>

				<div id="providersSection" class="providers-section">
					<p id="alternative" class="alternative-label">#{msgs['passport.orUseExternal']}</p>
					<table class="provider-list">
						<tbody id="add_here">
						</tbody>
					</table>
				</div>

				<h:inputHidden id="platform" />
				<h:inputHidden id="provider" />
			</h:form>
		</main>

		<script type="text/javascript">
			//<![CDATA[
			(function () {
				var jsonProviders = '${identity.getWorkingParameter("externalProviders")}';

				function setInputsRequired(isRequired) {
					var userEl = document.getElementById("loginForm:username");
					var pwdEl = document.getElementById("loginForm:password");
					if (userEl) {
						if (isRequired) {
							userEl.setAttribute("required", "required");
						} else {
							userEl.removeAttribute("required");
						}
					}
					if (pwdEl) {
						if (isRequired) {
							pwdEl.setAttribute("required", "required");
						} else {
							pwdEl.removeAttribute("required");
						}
					}
				}

				function fillPlatformField() {
					var platformField = document.getElementById("loginForm:platform");
					if (!platformField) {
						return;
					}
					try {
						var info = {
							userAgent: navigator.userAgent,
							language: navigator.language || "",
							platform: navigator.platform || ""
						};
						platformField.value = JSON.stringify(info);
					} catch (e) {
					}
				}

				window.idp_redirect = function (provider) {
					setInputsRequired(false);
					var form = document.forms["loginForm"];
					var providerField = document.getElementById("loginForm:provider");
					var loginButton = document.getElementById("loginForm:loginButton");

					if (providerField) {
						providerField.value = provider;
					}
					if (loginButton) {
						loginButton.click();
					} else if (form) {
						form.submit();
					}
				};

				function addRow(provider, name) {
					var tbody = document.getElementById("add_here");
					if (!tbody) {
						return;
					}
					var displayName = name ? name : provider;

					var tr = document.createElement("tr");
					tr.className = "provider-row";
					tr.addEventListener("click", function () {
						window.idp_redirect(provider);
					});

					var td = document.createElement("td");
					td.className = "provider-cell";
					td.textContent = displayName;

					tr.appendChild(td);
					tbody.appendChild(tr);
				}

				function renderExternalProviders() {
					try {
						if (!jsonProviders) {
							return;
						}
						var externalProviders = JSON.parse(jsonProviders);
						var ids = Object.keys(externalProviders);

						if (ids.length > 0) {
							ids.sort(function (p1, p2) {
								var n1 = externalProviders[p1] && externalProviders[p1].displayName ? externalProviders[p1].displayName : p1;
								var n2 = externalProviders[p2] && externalProviders[p2].displayName ? externalProviders[p2].displayName : p2;
								return n1 > n2 ? 1 : (n1 < n2 ? -1 : 0);
							});

							for (var i = 0; i < ids.length; i++) {
								var provider = ids[i];
								var prov = externalProviders[provider] || {};
								var name = prov.displayName ? prov.displayName : provider;
								addRow(provider, name);
							}

							var section = document.getElementById("providersSection");
							if (section) {
								section.className += " is-visible";
							}
						}
					} catch (e) {
					}
				}

				document.addEventListener("DOMContentLoaded", function () {
					setInputsRequired(true);
					fillPlatformField();
					renderExternalProviders();
				});
			})();
			//]]>
		</script>
	</h:body>
</f:view>
</html>
